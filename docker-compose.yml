services:
  lemon-manuals:
    container_name: lemon-manuals
    image: hellreaver/lemon-manuals:latest
    # To build locally instead, comment out "image" and uncomment "build".
    # The build folder needs the Dockerfile plus lemon-website-linux-x86_64-glibc.
    # build:
    #   context: .
    restart: unless-stopped
    ports:
      - "16080:8080"
    volumes:
      # Point these at the "lemon" and "charm" folders from the LEMON torrent.
      # Each folder must contain an index.json. Read-only is enough.
      - /mnt/user/downloads/lemon-manuals/lemon:/data/lemon:ro
      - /mnt/user/downloads/lemon-manuals/charm:/data/charm:ro
